name: Importer DR5 DR6 officiels
on:
  push:
    paths:
      - '.github/workflows/import-dr56.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer la conversion documentaire
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer poppler-utils
      - name: Télécharger le dossier candidat officiel Éduscol
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            --user-agent 'Mozilla/5.0 (compatible; EducationalDocumentImport/1.0)' \
            'https://sti.eduscol.education.fr/sites/eduscol.education.fr.sti/files/concours-examens/15561/15561-bts-ms-sp-e4-sujet-nc-2022-copie.docx' \
            -o /tmp/feige.docx
          file /tmp/feige.docx
          test "$(stat -c%s /tmp/feige.docx)" -gt 10000
          libreoffice -env:UserInstallation=file:///tmp/lo-feige-dr56 --headless --convert-to pdf --outdir /tmp /tmp/feige.docx
          test -s /tmp/feige.pdf
      - name: Repérer DR5 et DR6 sur les pages rendues
        run: |
          python3 - <<'PY'
          import subprocess,re,os
          pdf='/tmp/feige.pdf'
          pagecount=int(subprocess.check_output(['pdfinfo',pdf],text=True).split('Pages:')[1].splitlines()[0].strip())
          matched=[]
          for i in range(1,pagecount+1):
              t=subprocess.check_output(['pdftotext','-f',str(i),'-l',str(i),'-layout',pdf,'-'],text=True)
              norm=re.sub(r'\s+',' ',t).upper()
              if re.search(r'\bDR\s*5\b',norm) and re.search(r'\bDR\s*6\b',norm):matched.append(i)
          print('DR5 et DR6 trouvés aux pages PDF:',matched,'pages totales',pagecount,flush=True)
          if len(matched)!=1:raise RuntimeError('Repérage ambigu ou introuvable : aucune image ajoutée')
          os.makedirs('assets',exist_ok=True)
          subprocess.run(['pdftoppm','-f',str(matched[0]),'-l',str(matched[0]),'-singlefile','-r','170','-png',pdf,'assets/dr5_dr6_officiel'],check=True)
          assert os.path.getsize('assets/dr5_dr6_officiel.png')>30000
          print('Image extraite, octets:',os.path.getsize('assets/dr5_dr6_officiel.png'),flush=True)
          PY
      - name: Publier l'image (sans toucher aux autres pages)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dr5_dr6_officiel.png
          git diff --cached --quiet || (git commit -m 'Ajouter DR5 DR6 depuis le sujet officiel FEIGE' && git push)
