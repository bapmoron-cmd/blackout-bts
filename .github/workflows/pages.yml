name: Publier BLACKOUT
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les fichiers du jeu
        run: |
          test -f index.html || (echo "index.html manquant"; exit 1)
          test -d assets || (echo "assets manquant"; exit 1)
          test "$(find assets -type f | wc -l)" -ge 26 || (echo "documents techniques incomplets"; exit 1)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
